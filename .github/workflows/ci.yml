name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test packages/js/test/client.test.js

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck -w packages/typescript
      - run: npm run build -w packages/typescript

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install packages/python
      - run: |
          python -c "
          from jokelboard import JokelboardClient, BoardClient, find_card
          from jokelboard import JokelboardError, JokelboardConfigurationError, RateLimitError, RevisionConflictError
          board = {'data': {'lists': [{'id': 'l1', 'title': 'T', 'cards': [{'id': 'c1', 'title': 'Fix'}]}]}}
          m = find_card(board, lambda c, _: c['id'] == 'c1')
          assert m['card']['title'] == 'Fix'
          try:
              JokelboardClient(token='bad')
          except JokelboardConfigurationError:
              pass
          print('python ok')
          "
